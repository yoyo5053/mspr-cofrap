apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cofrap-ingress
  namespace: cofrap
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: cofrap.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
  - host: localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
