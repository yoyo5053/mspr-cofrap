openapi: 3.0.3
info:
  title: COFRAP Authentication API
  description: |
    Serverless authentication API for the COFRAP platform.

    Four independent OpenFaaS functions implement account creation,
    TOTP authentication, renewal, and recovery via backup code.

    **Standards**: RFC 6238 (TOTP), bcrypt, Fernet (AES-128-CBC + HMAC-SHA256).
  version: "1.0.0"
  contact:
    name: COFRAP Team
    email: support@cofrap.fr

servers:
  - url: http://localhost:8080
    description: Local development (Docker Desktop)
  - url: https://api.cofrap.fr
    description: Production (example)

tags:
  - name: Registration
    description: Account creation and initial setup
  - name: Authentication
    description: Login and 2FA verification
  - name: Recovery
    description: Renewal and recovery via backup code

paths:
  /function/generate-password:
    post:
      tags: [Registration]
      summary: Generates a password and creates (or updates) the user
      description: |
        Generates a random 24-character password, hashes it with bcrypt, and stores it
        in the database. If the user doesn't exist, it is created. If it exists, its
        password is replaced (used for renewal).

        Returns a QR code (base64 PNG) containing the plaintext password, to be scanned
        with a camera or a password manager.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameOnly'
            example:
              username: michel.ranu
      responses:
        '200':
          description: Password generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrCodeResponse'

  /function/generate-2fa:
    post:
      tags: [Registration]
      summary: Generates a TOTP secret and 10 backup codes
      description: |
        Generates a TOTP secret (RFC 6238), encrypts it with Fernet, and stores it.
        Generates 10 backup codes in the `XXXX-XXXX` format, hashes them with bcrypt, and stores them.

        Returns a QR code (base64 PNG) in `otpauth://` format to be scanned with
        Google Authenticator/Authy, **and** the 10 plaintext backup codes.

        The codes will **never be shown again**: the frontend must force the user
        to save them before continuing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameOnly'
            example:
              username: michel.ranu
      responses:
        '200':
          description: 2FA secret and backup codes generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generate2FAResponse'

  /function/authenticate:
    post:
      tags: [Authentication]
      summary: Authenticates a user with credentials + TOTP
      description: |
        Verifies: (1) the rate limit (max 5 failures/min), (2) the password via bcrypt,
        (3) the TOTP code via pyotp (±30 second tolerance).

        Returns `expired: true` if the credentials are more than 6 months old (forced rotation).
        The frontend must then redirect to `/renew`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateRequest'
            example:
              username: michel.ranu
              password: AbCdEf1234xyzPQRSTUVWXYZ
              totp_code: "847291"
      responses:
        '200':
          description: Authentication response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthenticateSuccess'
                  - $ref: '#/components/schemas/AuthenticateFailure'
                  - $ref: '#/components/schemas/RateLimitedResponse'
              examples:
                success:
                  value: { success: true, expired: false, gendate: 1715000000 }
                expired:
                  value: { success: true, expired: true, gendate: 1700000000 }
                invalid:
                  value: { success: false, error: invalid_credentials }
                rate_limited:
                  value:
                    success: false
                    error: rate_limited
                    message: Too many attempts. Try again in 1 minute.

  /function/recover-with-backup-code:
    post:
      tags: [Recovery]
      summary: Recovers access to an account via a backup code
      description: |
        Verifies that a submitted backup code matches an unused code belonging to the user.

        If it matches: the code is marked `used_at = NOW()` (one-shot), a new password
        is generated and returned via QR code. **The 2FA secret stays unchanged**:
        the user can log back in immediately with their usual TOTP code.

        Subject to the same rate limiting as `authenticate` (5 failures/min per username).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverRequest'
            example:
              username: michel.ranu
              backup_code: A2B4-C6D8
      responses:
        '200':
          description: Recovery result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RecoverSuccess'
                  - $ref: '#/components/schemas/RecoverFailure'

components:
  schemas:
    UsernameOnly:
      type: object
      required: [username]
      properties:
        username:
          type: string
          maxLength: 64
          example: michel.ranu

    QrCodeResponse:
      type: object
      properties:
        qr_code:
          type: string
          description: PNG image encoded in base64
          example: iVBORw0KGgoAAAANSUhEUg...

    Generate2FAResponse:
      type: object
      properties:
        qr_code:
          type: string
          description: Base64 PNG, containing the `otpauth://totp/...` URI for Google Authenticator
        backup_codes:
          type: array
          description: 10 codes in the XXXX-XXXX format. Returned ONLY ONCE.
          items:
            type: string
            pattern: '^[A-Z2-9]{4}-[A-Z2-9]{4}$'
          minItems: 10
          maxItems: 10
          example:
            - A2B4-C6D8
            - E1F3-G5H7
            - I9J2-K4L6
            - M8N0-P2Q4
            - R6S8-T1U3
            - V5W7-X9Y2
            - Z4A6-B8C1
            - D3E5-F7G9
            - H2I4-J6K8
            - L1M3-N5P7

    AuthenticateRequest:
      type: object
      required: [username, password, totp_code]
      properties:
        username:
          type: string
          example: michel.ranu
        password:
          type: string
          example: AbCdEf1234xyzPQRSTUVWXYZ
        totp_code:
          type: string
          pattern: '^\d{6}$'
          example: "847291"

    AuthenticateSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        expired:
          type: boolean
          description: True if the credentials are more than 6 months old (forced rotation)
          example: false
        gendate:
          type: integer
          description: Unix timestamp of the last credentials generation
          example: 1715000000

    AuthenticateFailure:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: string
          enum: [invalid_credentials, missing_fields, 2fa_not_configured, invalid_json]
          example: invalid_credentials

    RateLimitedResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: string
          enum: [rate_limited]
        message:
          type: string
          example: Too many attempts. Try again in 1 minute.

    RecoverRequest:
      type: object
      required: [username, backup_code]
      properties:
        username:
          type: string
        backup_code:
          type: string
          pattern: '^[A-Z2-9]{4}-[A-Z2-9]{4}$'
          example: A2B4-C6D8

    RecoverSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        qr_code:
          type: string
          description: QR code of the new password (base64 PNG)

    RecoverFailure:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: string
          enum: [invalid_code, rate_limited, missing_fields, invalid_json]
